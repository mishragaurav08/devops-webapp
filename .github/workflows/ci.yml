name: Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::964060772510:role/GitHubActions-DevOpsWebApp
          aws-region: us-east-1

      - name: Deploy to S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: aws s3 sync dist/ s3://devops-webapp-gaurav-2026 --delete

      - name: Send Slack Success Notification
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not configured"
            exit 1
          fi

          COMMIT_SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ACTION_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          SLACK_MESSAGE=$(cat <<EOF
          ✅ AWS Deployment Successful

          Project: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: $COMMIT_SHORT_SHA
          Platform: AWS
          Status: Production deployment completed successfully.

          GitHub Actions Run:
          $ACTION_RUN_URL
          EOF
          )

          curl --fail-with-body \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$(printf '%s' "$SLACK_MESSAGE" | jq -Rs '{text: .}')" \
            "$SLACK_WEBHOOK_URL"

      - name: Send Slack Failure Notification
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not configured"
            exit 1
          fi

          COMMIT_SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ACTION_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          SLACK_MESSAGE=$(cat <<EOF
          ❌ AWS Deployment Failed

          Project: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          Commit: $COMMIT_SHORT_SHA
          Platform: AWS
          Status: Build or deployment failed.

          GitHub Actions Run:
          $ACTION_RUN_URL
          EOF
          )

          curl --fail-with-body \
            -X POST \
            -H "Content-Type: application/json" \
            --data "$(printf '%s' "$SLACK_MESSAGE" | jq -Rs '{text: .}')" \
            "$SLACK_WEBHOOK_URL"

