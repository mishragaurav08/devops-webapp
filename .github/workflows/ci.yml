name: Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::964060772510:role/GitHubActions-DevOpsWebApp
          aws-region: us-east-1

      - name: Deploy to S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: aws s3 sync dist/ s3://devops-webapp-gaurav-2026 --delete

      - name: Send Slack Success Notification
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          WEBHOOK_URL=$(echo "$SLACK_WEBHOOK_URL" | tr -d '\r\n ' | xargs)
          if [ -z "$WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is missing or empty in secrets."
            exit 1
          fi

          if [[ "$WEBHOOK_URL" != https://hooks.slack.com/services/* ]]; then
            echo "SLACK_WEBHOOK_URL format does not start with https://hooks.slack.com/services/"
            exit 1
          fi

          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PAYLOAD=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "$SHORT_SHA" \
            --arg url "$RUN_URL" \
            '{
              text: "✅ *AWS Deployment Successful*\n\n*Project:* \($repo)\n*Branch:* \($ref)\n*Commit:* \($sha)\n*Platform:* AWS\n*Status:* Production deployment completed successfully.\n\n*GitHub Actions Run:*\n\($url)"
            }')

          curl -sS -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$WEBHOOK_URL"

      - name: Send Slack Failure Notification
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          WEBHOOK_URL=$(echo "$SLACK_WEBHOOK_URL" | tr -d '\r\n ' | xargs)
          if [ -z "$WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is missing or empty in secrets."
            exit 1
          fi

          if [[ "$WEBHOOK_URL" != https://hooks.slack.com/services/* ]]; then
            echo "SLACK_WEBHOOK_URL format does not start with https://hooks.slack.com/services/"
            exit 1
          fi

          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PAYLOAD=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg sha "$SHORT_SHA" \
            --arg url "$RUN_URL" \
            '{
              text: "❌ *AWS Deployment Failed*\n\n*Project:* \($repo)\n*Branch:* \($ref)\n*Commit:* \($sha)\n*Platform:* AWS\n*Status:* Build or deployment failed.\n\n*GitHub Actions Run:*\n\($url)"
            }')

          curl -sS -X POST \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "$WEBHOOK_URL"




