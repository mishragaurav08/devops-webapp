name: Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::964060772510:role/GitHubActions-DevOpsWebApp
          aws-region: us-east-1

      - name: Deploy to S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: aws s3 sync dist/ s3://devops-webapp-gaurav-2026 --delete

      - name: Send Slack Success Notification
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          COMMIT_SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ACTION_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -X POST \
            -H "Content-Type: application/json" \
            --data "$(jq -n \
              --arg repo "${{ github.repository }}" \
              --arg ref "${{ github.ref_name }}" \
              --arg sha "$COMMIT_SHORT_SHA" \
              --arg url "$ACTION_RUN_URL" \
              '{
                text: "✅ *AWS Deployment Successful*\n\n*Project:* \($repo)\n*Branch:* \($ref)\n*Commit:* \($sha)\n*Platform:* AWS Amplify\n*Status:* Production deployment completed successfully.\n*Workflow Run:* \($url)"
              }')" \
            "$SLACK_WEBHOOK_URL"

      - name: Send Slack Failure Notification
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          COMMIT_SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ACTION_RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -X POST \
            -H "Content-Type: application/json" \
            --data "$(jq -n \
              --arg repo "${{ github.repository }}" \
              --arg ref "${{ github.ref_name }}" \
              --arg sha "$COMMIT_SHORT_SHA" \
              --arg url "$ACTION_RUN_URL" \
              '{
                text: "❌ *AWS Deployment Failed*\n\n*Project:* \($repo)\n*Branch:* \($ref)\n*Commit:* \($sha)\n*Platform:* AWS Amplify\n*Status:* Deployment failed.\n*Workflow Run:* \($url)"
              }')" \
            "$SLACK_WEBHOOK_URL"
